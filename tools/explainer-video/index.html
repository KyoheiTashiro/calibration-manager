<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機器点検と校正の期限管理アプリ 解説動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@500;600&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout: 16:9 の舞台を動画プレーヤーとして置き、下に操作パネルと章の索引を並べる。舞台は暗色一択（3Blue1Brown 風）。 */
:root {
  color-scheme: dark;
  --bg: #07090e;
  --stage: #0b0f17;
  --ink: #e9edf2;
  --dim: #8a94a3;
  --line: #222a38;
  --accent: #58c4dd;
  --mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --sans: 'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { font-family: var(--mincho); font-weight: 600; font-size: clamp(22px, 3vw, 30px); margin: 0; text-wrap: balance; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: .06em; }
.player { position: relative; container-type: inline-size; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--stage); border-radius: 6px; overflow: hidden; cursor: pointer; }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cap { position: absolute; left: 50%; bottom: 3.2%; transform: translateX(-50%); width: max-content; max-width: 88%; text-align: center;
  font-size: clamp(12px, 2.25cqw, 27px); line-height: 1.45; padding: .3em .8em; background: rgba(7, 9, 14, .8); border-radius: 4px; pointer-events: none; }
.cap:empty { display: none; }
@container (max-width: 640px) {
  .cap, .cap:empty { position: static; display: flex; align-items: center; justify-content: center; transform: none; width: auto; max-width: none; min-height: 4.6em;
    margin-top: 6px; font-size: 15px; background: var(--stage); }
}
.cap.off { display: none; }
[hidden] { display: none !important; }
.big-play { position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%); width: 7cqw; height: 7cqw; min-width: 52px; min-height: 52px; border-radius: 50%;
  border: 2px solid var(--ink); background: rgba(11, 15, 23, .6); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.big-play svg { position: static; width: 38%; height: 38%; }
.big-play:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.controls button, .controls select { font: 500 13px var(--sans); color: var(--ink); background: #121826; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.time { font-family: var(--mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 9.5em; }
.scrub-wrap { position: relative; flex: 1 1 260px; min-width: 0; height: 22px; display: flex; align-items: center; }
.scrub-wrap input { width: 100%; margin: 0; accent-color: var(--accent); position: relative; z-index: 1; }
.tick { position: absolute; top: 2px; width: 1px; height: 18px; background: #3a4456; pointer-events: none; }
.chapters { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.chapters button { width: 100%; text-align: left; display: grid; grid-template-columns: 2.2em 1fr auto; gap: 8px; align-items: baseline; font: 14px var(--sans);
  color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.chapters button:hover { border-color: #3a4456; }
.chapters button.now { border-color: var(--accent); }
.chapters .n, .chapters .d { font-family: var(--mono); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--dim); line-height: 1.7; max-width: 72ch; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>機器点検と校正の期限管理アプリ 解説動画</h1>
    <span class="meta">13 章 / 音声 VOICEVOX:四国めたん</span>
  </header>

  <div class="player">
    <div class="frame" id="frame" aria-label="解説アニメーション">
      <svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="解説アニメーション"></svg>
      <button class="big-play" id="bigplay" aria-label="再生">
        <svg viewBox="0 0 24 24"><path d="M7 4 L20 12 L7 20 Z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="cap" id="cap" aria-live="polite"></div>
  </div>

  <div class="controls">
    <button id="play" aria-label="再生と一時停止">再生</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <div class="scrub-wrap" id="scrubwrap"><input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="再生位置"></div>
    <select id="speed" aria-label="再生速度">
      <option value="0.75">0.75 倍</option>
      <option value="1" selected>1 倍</option>
      <option value="1.25">1.25 倍</option>
      <option value="1.5">1.5 倍</option>
    </select>
    <button id="cc" aria-pressed="true">字幕</button>
  </div>

  <ol class="chapters" id="chapters"></ol>

  <p class="note">マニュアル画面に載せる解説動画の元データ。mp4 と字幕は build.mjs で書き出す。<br>
  キー操作：Space で再生と一時停止、左右の矢印キーで 5 秒移動。</p>
</div>

<script id="scenes">
/* ---------- 色と書体 ---------- */
const C = {
  bg: '#0b0f17', panel: '#111827', ink: '#e9edf2', dim: '#8a94a3', faint: '#3a4456', line: '#4a5568',
  A: '#F7D96F', B: '#58C4DD', Cc: '#A7AFBB', app: '#5CD0B3', con: '#FC6255', adm: '#B48EE6', lock: '#F0AC5F', ok: '#83C167', car: '#56627a'
};
const F = {
  serif: "'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif",
  latin: "'STIX Two Text','Times New Roman',serif",
  sans: "'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif",
  mono: "'IBM Plex Mono',ui-monospace,Menlo,monospace"
};

/* ---------- 計算 ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, u) => a + (b - a) * u;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* 文字列の描画幅の目安（全角 1em、半角 0.6em） */
const tw = (s, size) => [...s].reduce((a, ch) => a + (ch.charCodeAt(0) < 128 ? .6 : 1), 0) * size;
/* 2 点間を弧を描いて移動する。u は 0..1 */
const fly = (x1, y1, x2, y2, u, h = 60) => [lerp(x1, x2, u), lerp(y1, y2, u) - Math.sin(Math.PI * u) * h];

/* ---------- SVG の部品（どれもマークアップ文字列を返す） ---------- */
function T(x, y, str, o = {}) {
  const { size = 24, fill = C.ink, anchor = 'middle', font = 'sans', weight = 400, op = 1, ls = 0, rot = 0 } = o;
  if (op <= 0.002) return '';
  const ff = F[font] || F.sans;
  const tr = rot ? ` transform="rotate(${rot} ${x} ${y})"` : '';
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-family="${ff}" font-weight="${weight}" opacity="${op}"${ls ? ` letter-spacing="${ls}"` : ''} dominant-baseline="middle"${tr}>${esc(str)}</text>`;
}
function R(x, y, w, h, o = {}) {
  const { rx = 6, fill = 'none', stroke = 'none', sw = 2, op = 1, fop, draw, dash } = o;
  if (op <= 0.002) return '';
  if (draw !== undefined && draw < 1) {
    if (draw <= 0.002) return '';
    const p = `M${x + rx},${y} H${x + w - rx} Q${x + w},${y} ${x + w},${y + rx} V${y + h - rx} Q${x + w},${y + h} ${x + w - rx},${y + h} H${x + rx} Q${x},${y + h} ${x},${y + h - rx} V${y + rx} Q${x},${y} ${x + rx},${y} Z`;
    return `<path d="${p}" fill="${fill}"${fop !== undefined ? ` fill-opacity="${fop * draw}"` : ''} stroke="${stroke}" stroke-width="${sw}" opacity="${op}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - draw}"/>`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}"${fop !== undefined ? ` fill-opacity="${fop}"` : ''} stroke="${stroke}" stroke-width="${sw}" opacity="${op}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
}
function head_(x, y, a, stroke, sw, op, h = 12) {
  const p1 = [x - h * Math.cos(a - .45), y - h * Math.sin(a - .45)], p2 = [x - h * Math.cos(a + .45), y - h * Math.sin(a + .45)];
  return `<path d="M${p1} L${x},${y} L${p2}" fill="none" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function Ln(x1, y1, x2, y2, o = {}) {
  const { stroke = C.ink, sw = 2.5, op = 1, p = 1, arrow = false, dash = null, head = 12 } = o;
  if (op <= 0.002 || p <= 0.002) return '';
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p);
  let s = `<line x1="${x1}" y1="${y1}" x2="${x}" y2="${y}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  if (arrow) s += head_(x, y, Math.atan2(y2 - y1, x2 - x1), stroke, sw, op, head);
  return s;
}
function Curve(x1, y1, cx, cy, x2, y2, o = {}) {
  const { stroke = C.ink, sw = 2.5, op = 1, p = 1, arrow = false } = o;
  if (op <= 0.002 || p <= 0.002) return '';
  let s = `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="${stroke}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>`;
  if (arrow && p > .97) s += head_(x2, y2, Math.atan2(y2 - cy, x2 - cx), stroke, sw, op * (p - .97) / .03, 11);
  return s;
}
function Cir(x, y, r, o = {}) {
  const { fill = 'none', stroke = 'none', sw = 2, op = 1 } = o;
  if (op <= 0.002) return '';
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`;
}
function pawn(x, y, color, o = {}) {
  const { op = 1, label = '', s = 1, lc = C.dim, ls = 15 } = o;
  if (op <= 0.002) return '';
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><circle cx="0" cy="-40" r="14" fill="${color}"/><path d="M-21,0 Q-21,-23 0,-23 Q21,-23 21,0 Z" fill="${color}"/></g>`
    + (label ? T(x, y + 18 * s, label, { size: ls, fill: lc, op }) : '');
}
function env(x, y, o = {}) {
  const { op = 1, color = C.ink, s = 1 } = o;
  if (op <= 0.002) return '';
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><rect x="-17" y="-12" width="34" height="24" rx="3" fill="${C.bg}" stroke="${color}" stroke-width="2"/><path d="M-17,-11 L0,3 L17,-11" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></g>`;
}
function lockI(x, y, o = {}) {
  const { op = 1, color = C.lock, s = 1 } = o;
  if (op <= 0.002) return '';
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><path d="M-6,-2 V-7 A6,6 0 0 1 6,-7 V-2" fill="none" stroke="${color}" stroke-width="2.4"/><rect x="-9" y="-2" width="18" height="14" rx="2.5" fill="${color}"/></g>`;
}
function check(x, y, o = {}) {
  const { op = 1, color = C.ok, s = 1, p = 1 } = o;
  if (op <= 0.002 || p <= 0.002) return '';
  return `<path d="M${x - 12 * s},${y} L${x - 3 * s},${y + 9 * s} L${x + 14 * s},${y - 10 * s}" fill="none" stroke="${color}" stroke-width="${4 * s}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>`;
}
function cross(x, y, o = {}) {
  const { op = 1, color = C.con, s = 1, p = 1 } = o;
  if (op <= 0.002) return '';
  return Ln(x - 11 * s, y - 11 * s, x + 11 * s, y + 11 * s, { stroke: color, sw: 4 * s, op, p: clamp(p * 2) })
    + Ln(x + 11 * s, y - 11 * s, x - 11 * s, y + 11 * s, { stroke: color, sw: 4 * s, op, p: clamp(p * 2 - 1) });
}
function stamp(x, y, str, o = {}) {
  const { p = 1, color = C.con, rot = -8, size = 34 } = o;
  if (p <= 0.002) return '';
  const w = tw(str, size) + str.length * 3 + 40, sc = lerp(1.5, 1, p);
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${sc})" opacity="${p}"><rect x="${-w / 2}" y="${-size * .85}" width="${w}" height="${size * 1.7}" rx="4" fill="${C.bg}" fill-opacity=".85" stroke="${color}" stroke-width="3"/>`
    + `<text x="0" y="2" font-size="${size}" fill="${color}" text-anchor="middle" dominant-baseline="middle" font-family="${F.sans}" font-weight="600" letter-spacing="3">${esc(str)}</text></g>`;
}
function box(x, y, w, h, label, o = {}) {
  const { op = 1, color = C.ink, size = 20, fill = C.panel, sub = null, subSize = 14, draw } = o;
  if (op <= 0.002) return '';
  let s = R(x, y, w, h, { rx: 6, fill, stroke: color, sw: 2, op, draw });
  const ty = sub ? y + h / 2 - 12 : y + h / 2;
  s += T(x + w / 2, ty, label, { size, fill: color, op, weight: 500 });
  if (sub) s += T(x + w / 2, y + h / 2 + 15, sub, { size: subSize, fill: C.dim, op });
  return s;
}
function chip(x, y, label, o = {}) {
  const { op = 1, color = C.ok, size = 15 } = o;
  const w = tw(label, size) + 36;
  return R(x, y, w, 36, { rx: 18, fill: C.panel, stroke: color, sw: 1.5, op }) + T(x + w / 2, y + 18, label, { size, op });
}

/* ---------- この題材の部品 ---------- */
/* ステータスの色。全章で同じ色を使う */
const ST = { 期限切れ: C.con, 要発注: C.lock, 校正中: C.B, 期限接近: C.A, 正常: C.ok };
const COLS = ['発注準備', '発注済', '校正中', '返却済', '記録登録済'];
function pill(x, y, label, o = {}) {
  const { op = 1, color = ST[label] || C.Cc, size = 12 } = o;
  const { w = tw(label, size) + 22, h = size + 12 } = o;
  return R(x, y, w, h, { rx: h / 2, fill: color, fop: .16, stroke: color, sw: 1.5, op }) + T(x + w / 2, y + h / 2 + .5, label, { size, fill: color, weight: 600, op });
}
/* 点検校正項目のカード。status はステータスの名前、sop はその濃さ */
function item(x, y, w, h, title, sub, o = {}) {
  const { op = 1, glow = 0, glowColor = C.ink, status = null, sop = 1 } = o;
  if (op <= 0.002) return '';
  let s = R(x - 5, y - 5, w + 10, h + 10, { rx: 10, stroke: glowColor, sw: 2.5, op: op * glow });
  s += R(x, y, w, h, { rx: 6, fill: '#1a202c', stroke: C.ink, sw: 2, op });
  s += T(x + 16, y + 24, title, { size: 17, weight: 600, anchor: 'start', op });
  if (sub) s += T(x + 16, y + 49, sub, { size: 12, fill: C.dim, anchor: 'start', op });
  if (status) s += pill(x + 16, y + h - 32, status, { op: op * sop });
  return s;
}
/* 実施記録の紙 */
function rec(x, y, l1, l2, o = {}) {
  const { op = 1, w = 124, h = 80 } = o;
  if (op <= 0.002) return '';
  return R(x, y, w, h, { rx: 3, fill: '#efe8cf', op }) + T(x + w / 2, y + 18, '実施記録', { size: 14, weight: 600, fill: '#1b1f27', op })
    + Ln(x + 14, y + 32, x + w - 14, y + 32, { stroke: '#b9b196', sw: 1, op }) + T(x + w / 2, y + 47, l1, { size: 12, weight: 500, fill: '#1b1f27', op })
    + T(x + w / 2, y + 65, l2, { size: 13, weight: 600, fill: l2 === '不合格' ? '#b3261e' : '#2e7d1e', op });
}
/* 点検校正外部案件の札 */
function ticket(x, y, title, sub, o = {}) {
  const { op = 1, w = 150, h = 54, size = 15 } = o;
  if (op <= 0.002) return '';
  return R(x, y, w, h, { rx: 3, fill: '#cdbcf0', op }) + T(x + w / 2, sub ? y + h / 2 - 8 : y + h / 2, title, { size, weight: 600, fill: '#1b1530', op })
    + (sub ? T(x + w / 2, y + h / 2 + 12, sub, { size: 11, fill: '#3d335c', op }) : '');
}
/* 通知のベル。n は未読の件数、nop はその濃さ */
function bell(x, y, o = {}) {
  const { op = 1, n = 0, nop = 1, s = 1 } = o;
  if (op <= 0.002) return '';
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><path d="M-13,10 Q-9,4 -9,-4 A9,9 0 0 1 9,-4 Q9,4 13,10 Z" fill="none" stroke="${C.ink}" stroke-width="2.4" stroke-linejoin="round"/>`
    + `<circle cx="0" cy="15" r="2.6" fill="${C.ink}"/><line x1="0" y1="-13" x2="0" y2="-16" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/>`
    + (n && nop > 0.002 ? `<g opacity="${nop}"><circle cx="11" cy="-11" r="8" fill="${C.con}"/><text x="11" y="-10.5" font-size="11" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="${F.sans}" font-weight="600">${n}</text></g>` : '') + '</g>';
}
/* ブラウザーの窓 */
function win(x, y, w, h, label, o = {}) {
  const { op = 1 } = o;
  if (op <= 0.002) return '';
  return R(x, y, w, h, { rx: 8, fill: C.panel, fop: .35, stroke: C.line, sw: 2, op }) + Ln(x, y + 34, x + w, y + 34, { stroke: C.line, sw: 1.5, op })
    + [0, 1, 2].map(i => Cir(x + 18 + i * 16, y + 17, 4.5, { fill: C.faint, op })).join('') + T(x + w - 16, y + 17, label, { size: 13, fill: C.dim, anchor: 'end', op });
}
function flag(x, y, color, o = {}) {
  const { op = 1, h = 46 } = o;
  if (op <= 0.002) return '';
  return Ln(x, y, x, y - h, { stroke: color, sw: 2.5, op }) + `<path d="M${x},${y - h} l22,8 l-22,8 Z" fill="${color}" opacity="${op}"/>`;
}
function csv(x, y, o = {}) {
  const { op = 1 } = o;
  if (op <= 0.002) return '';
  return R(x, y, 64, 84, { rx: 3, fill: C.ink, op }) + T(x + 32, y + 20, 'CSV', { size: 15, font: 'mono', weight: 500, fill: C.bg, op })
    + [0, 1, 2, 3].map(i => Ln(x + 12, y + 38 + i * 11, x + 52, y + 38 + i * 11, { stroke: C.dim, sw: 1.5, op })).join('');
}
/* 案件のボード。1 列の幅 w、高さ h、字の大きさ size */
function board(x, y, w, h, gap, size, o = {}) {
  return COLS.map((n, i) => {
    const op = o.op ? o.op(i) : 1;
    return R(x + i * (w + gap), y, w, h, { fill: C.panel, stroke: C.faint, sw: 1.5, op }) + T(x + i * (w + gap) + w / 2, y + size * 1.5, n, { size, fill: C.dim, op });
  }).join('');
}

/* ---------- シーン ----------
   各シーン：name、cues（字幕）、draw(c)。
   c.t はシーン内の時刻、c.at(k) は字幕 k の開始時刻、c.p(k, 長さ, 遅れ) はイージング済みの進み具合。
   出典：各場面が素材のどの節・ルールに基づくかを、ここに書く。 */
const SCENES = [
/* 出典：docs/spec/domain-model.md と、マニュアル画面(src/features/manual)の本文 */
{
  name: 'はじめに',
  cues: [
    'こんにちは。この動画では、機器点検と校正の期限管理アプリを解説します。',
    'アプリの考え方と使い始めの手順を、順に説明します。',
    'はじめに、アプリの役割と用語を説明します。',
    '次に、期限、ステータス、外部案件、通知の仕組みを説明します。',

    /* 1 段目(字幕 2)：公開していることと、リンクの場所 */
    s += T(640, 186, 'ソースコードを GitHub で公開', { size: 16, fill: C.dim, op: c.p(2, .5) * fA });
    /* マニュアルの目次。前の章と同じ並びで、最後の節を光らせる */
    const M = ['ご利用にあたって', '基本の流れ', 'ステータスの見方', '期限と発注推奨日の計算', '各画面の説明', 'CSVエクスポートとインポート', 'プライバシーとデータの取り扱い', 'ライセンスとソースコード'];
    const oM = c.p(2, .5, 3) * fA;
    s += R(450, 230, 380, 310, { fill: C.panel, stroke: C.faint, sw: 1.5, op: oM }) + T(474, 257, '利用マニュアル', { size: 18, font: 'serif', weight: 600, anchor: 'start', op: oM });
    M.forEach((m, i) => {
      const y = 292 + i * 30, h = i === 7 ? c.p(2, .4, 3.9) : 0;
      s += R(464, y - 13, 352, 26, { rx: 3, fill: '#1f3344', op: h * fA }) + T(476, y, m, { size: 14, fill: h > .5 ? C.ink : C.Cc, weight: h > .5 ? 600 : 400, anchor: 'start', op: c.p(2, .4, 3.2 + i * .05) * fA });
    });
    s += T(806, 502, 'GitHubリポジトリ', { size: 12, fill: C.B, weight: 600, anchor: 'end', op: c.p(2, .4, 4.7) * fA });

    /* 2 段目(字幕 3〜5)：合わないところを、自社に合わせて直す。頼む先 */
    s += box(300, 200, 240, 80, 'アプリ', { size: 19, op: c.p(3, .5) * fB }) + box(740, 200, 240, 80, '自社のやり方', { size: 19, op: c.p(3, .5, .3) * fB });
    const oX = (1 - c.p(4, .3)) * fB;
    s += cross(640, 232, { p: c.p(3, .4, 1.6), op: oX }) + T(640, 266, '合わない', { size: 14, fill: C.dim, op: c.p(3, .4, 1.6) * oX });
    s += Ln(552, 248, 728, 248, { stroke: C.ok, arrow: true, p: c.p(4, .6, .4), op: fB }) + T(640, 224, '自社に合わせて作り返す', { size: 15, fill: C.ok, weight: 600, op: c.p(4, .4, .5) * fB });
    s += T(640, 326, '直す手段', { size: 15, fill: C.dim, op: c.p(5, .4) * fB });
    s += box(300, 348, 320, 76, '社内のプログラムを書ける人', { size: 17, sub: 'に頼む', op: c.p(5, .4, .3) * fB }) + box(660, 348, 320, 76, '外部のシステム開発会社', { size: 17, sub: 'に頼む', op: c.p(5, .4, 3) * fB });

    /* 3 段目(字幕 6〜7)：変えられる範囲と、その例。字幕の 3 文に合わせて 3 列。秒数は読み上げの位置 */
    s += mid(200, '改変', { op: c.p(6, .4, 2.2) * fC }, 500) + mid(200, '拡張', { op: c.p(6, .4, 2.9) * fC }, 590) + mid(200, '範囲に制限なし', { color: C.A, op: c.p(6, .4, 4) * fC }, 730);
    [
      ['直せる', .2, ['画面の文言', .9], ['入力欄', 3.1]],
      ['作り替えられる', 5.1, ['ログイン機能', 5.35], ['データの保存先', 7.1]],
      ['足せる', 12.9, ['メール送信での通知', 13.05], ['社内システムとの連携', 15.1]],
    ].forEach(([head, at, ...items], r) => {
      s += T(640, 258 + r * 94, head, { size: 15, fill: C.dim, op: c.p(7, .4, at) * fC });
      items.forEach(([l, at], i) => { s += box(335 + i * 330, 272 + r * 94, 280, 54, l, { size: 17, op: c.p(7, .4, at) * fC }); });
    });

    /* 4 段目(字幕 8)：決めるのは使う側であること */
    s += T(640, 252, '何を、どこまで変えるか', { size: 19, weight: 600, op: c.p(8, .5, .2) * fD });
    s += Ln(640, 274, 640, 300, { stroke: C.line, arrow: true, head: 9, p: c.p(8, .4, .9), op: fD }) + pawn(640, 372, C.A, { label: '使う側が決める', lc: C.ink, ls: 17, op: c.p(8, .5, 1.2) * fD });

    /* 5 段目(字幕 9〜10)：許可が要らないことと、ただ一つの条件 */
    s += mid(240, '作者の許可は不要', { color: C.A, op: c.p(9, .4, .3) }, 540) + mid(240, '連絡も不要', { color: C.A, op: c.p(9, .4, 1.5) }, 740);
    s += mid(350, '条件: 著作権表示とライセンス文を残す', { color: C.A, op: c.p(10, .5, .3) });
    return s;
  }
},
{
  name: 'クレジット',
  cues: [
    { s: 'この動画は、VOICEVOX の四国めたんの音声でお送りしました。', hold: 1.5 },
  ],
  draw(c) {
    return T(640, 246, '音声', { size: 20, fill: C.dim, op: c.p(0, .5) }) + T(640, 314, 'VOICEVOX:四国めたん', { size: 46, weight: 600, op: c.p(0, .6, .2) })
      + Ln(440, 380, 840, 380, { stroke: C.faint, sw: 1.5, p: c.p(0, .6, .5) }) + T(640, 418, '機器点検と校正の期限管理アプリ 解説動画', { size: 15, fill: C.dim, op: c.p(0, .5, .7) });
  }
},
];

/* ---------- タイムライン ---------- */
const BUILT = (() => {
  let start = 0;
  /* 読み上げ音声に合わせるときは、字幕ごとの表示秒数を CUE_DURS で上書きする */
  const ov = typeof CUE_DURS !== 'undefined' ? CUE_DURS : null;
  /* 場面の頭に章タイトルの区間を置く。長さは章名の読み上げに合わせて TITLE_DURS で上書きする */
  const tv = typeof TITLE_DURS !== 'undefined' ? TITLE_DURS : null;
  return SCENES.map((sc, si) => {
    const title = tv ? tv[si] : 2.6;
    let t = title + .6; const at = [], text = [];
    sc.cues.forEach((q, ci) => {
      const s = typeof q === 'string' ? q : q.s, hold = typeof q === 'object' ? (q.hold || 0) : 0;
      const chars = s.replace(/\s/g, '').length;
      at.push(t); text.push(s);
      t += ov ? ov[si][ci] : Math.max(3.4, 1.4 + chars * .13) + hold;
    });
    const b = { ...sc, at, text, title, dur: t + .9, start };
    start += b.dur;
    return b;
  });
})();
const TOTAL = BUILT.reduce((a, b) => a + b.dur, 0);

function sceneAt(v) {
  for (let k = 0; k < BUILT.length; k++) if (v < BUILT[k].start + BUILT[k].dur) return k;
  return BUILT.length - 1;
}
function frame(v) {
  v = clamp(v, 0, TOTAL - 1e-3);
  const i = sceneAt(v), sc = BUILT[i], t = v - sc.start;
  const c = {
    t, dur: sc.dur, at: k => sc.at[k],
    p: (k, d = .8, dl = 0) => ease(clamp((t - sc.at[k] - dl) / d)),
    after: k => t >= sc.at[k]
  };
  const body = clamp((t - sc.title) / .45), fade = body * clamp((sc.dur - t) / .45);
  const no = String(i + 1).padStart(2, '0');
  let svg = `<rect width="1280" height="720" fill="${C.bg}"/>`;
  svg += T(40, 40, no + '  ' + sc.name, { size: 14, fill: C.dim, anchor: 'start', ls: 2, op: body });
  /* 章タイトル：番号は表示だけ、章名は読み上げる */
  svg += `<g opacity="${clamp(t / .4) * clamp((sc.title - t) / .4)}">`
    + T(640, 292, no, { size: 30, font: 'mono', fill: C.B, ls: 6 }) + Ln(600, 328, 680, 328, { stroke: C.faint, sw: 2 })
    + T(640, 388, sc.name, { size: 58, font: 'serif', weight: 600 }) + '</g>';
  svg += `<g opacity="${fade}">${sc.draw(c)}</g>`;
  let cap = '';
  for (let k = sc.at.length - 1; k >= 0; k--) if (t >= sc.at[k]) { cap = sc.text[k]; break; }
  if (t > sc.dur - .35) cap = '';
  return { svg, cap, i };
}
</script>

<script>
(() => {
  const stage = document.getElementById('stage'), cap = document.getElementById('cap');
  const playBtn = document.getElementById('play'), big = document.getElementById('bigplay');
  const scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const speedSel = document.getElementById('speed'), ccBtn = document.getElementById('cc');
  const chapters = document.getElementById('chapters'), frameEl = document.getElementById('frame');
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  scrub.max = TOTAL.toFixed(2);
  const wrap = document.getElementById('scrubwrap');
  BUILT.forEach((b, i) => {
    if (i > 0) { const tk = document.createElement('span'); tk.className = 'tick'; tk.style.left = (b.start / TOTAL * 100) + '%'; wrap.appendChild(tk); }
    const li = document.createElement('li'), bt = document.createElement('button');
    bt.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span>${b.name}</span><span class="d">${fmt(b.start)}</span>`;
    bt.addEventListener('click', () => { started = true; seek(b.start + .01); });
    li.appendChild(bt); chapters.appendChild(li);
  });
  const chBtns = [...chapters.querySelectorAll('button')];

  /* 停止中の表紙：タイトルが出そろった瞬間 */
  let now = BUILT[0].dur - 1.2, playing = false, last = null, speed = 1, started = false, lastDrawn = -1, lastI = -1;

  function draw(force) {
    if (!force && Math.abs(now - lastDrawn) < 1e-4) return;
    lastDrawn = now;
    const f = frame(now);
    stage.innerHTML = f.svg;
    if (cap.textContent !== f.cap) cap.textContent = f.cap;
    scrub.value = now.toFixed(2);
    time.textContent = fmt(now) + ' / ' + fmt(TOTAL);
    if (f.i !== lastI) { chBtns.forEach((b, k) => b.classList.toggle('now', k === f.i)); lastI = f.i; }
  }
  function setPlaying(v) {
    playing = v; last = null;
    playBtn.textContent = v ? '一時停止' : '再生';
    big.hidden = v;
  }
  function toggle() {
    if (!started) { started = true; now = 0; }
    if (now >= TOTAL - .05) now = 0;
    setPlaying(!playing);
  }
  function seek(v) { now = clamp(v, 0, TOTAL); draw(true); }

  playBtn.addEventListener('click', toggle);
  big.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  frameEl.addEventListener('click', toggle);
  scrub.addEventListener('input', () => { started = true; seek(parseFloat(scrub.value)); });
  speedSel.addEventListener('change', () => { speed = parseFloat(speedSel.value); });
  ccBtn.addEventListener('click', () => {
    const on = ccBtn.getAttribute('aria-pressed') !== 'true';
    ccBtn.setAttribute('aria-pressed', String(on)); cap.classList.toggle('off', !on);
  });
  document.addEventListener('keydown', e => {
    if (['SELECT', 'BUTTON', 'INPUT'].includes(e.target.tagName) && e.code === 'Space') return;
    if (e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') { started = true; seek(now + 5); }
    else if (e.code === 'ArrowLeft') { started = true; seek(now - 5); }
  });

  function loop(ts) {
    if (playing) {
      if (last !== null) now += (ts - last) / 1000 * speed;
      last = ts;
      if (now >= TOTAL) { now = TOTAL; setPlaying(false); }
      draw();
    }
    requestAnimationFrame(loop);
  }
  /* #t123.4 で指定時刻から表示する（静止画の確認用） */
  const m = location.hash.match(/^#t([\d.]+)$/);
  if (m) { started = true; now = clamp(+m[1], 0, TOTAL); big.hidden = true; }
  draw(true);
  requestAnimationFrame(loop);

  /* 1 フレームずつ書き出すための口 */
  window.__explainer = { total: TOTAL, render: v => { now = v; draw(true); return frame(v).cap; } };
})();
</script>
